<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Compute Cloud</title><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#07101d;color:#fff}main{max-width:1100px;margin:auto;padding:34px 18px}.hero{padding:24px 0}.card{background:#101c30;padding:20px;border-radius:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.gpu{cursor:pointer}.muted{color:#9fb0cc}button{padding:11px 16px;border:0;border-radius:9px;font-weight:700;cursor:pointer}input,select{box-sizing:border-box;padding:11px;margin:5px 0;width:100%;background:#07101d;color:#fff;border:1px solid #345;border-radius:8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#243653;font-size:12px}.danger{background:#7d2635;color:#fff}.success{color:#8fe0a0}</style></head><body><main><section class="hero"><h1>AI Compute Cloud</h1><p class="muted">On-demand GPU compute with transparent hourly pricing.</p></section><section class="card"><h2>GPU Catalogue</h2><div id="g" class="grid"></div></section><section class="card"><h2>Account</h2><div class="grid"><div><input id="rn" placeholder="Name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password (8+ characters)"><button id="regBtn" type="button">Create account</button></div><div><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button id="loginBtn" type="button">Sign in</button></div></div><p id="m" class="muted"></p></section><section id="d" class="card" style="display:none"><div class="row"><h2 style="margin-right:auto">Dashboard</h2><button id="logoutBtn" type="button">Logout</button></div><div id="me"></div><hr><h3>Add wallet funds</h3><div class="row"><input id="fund" type="number" min="100" value="1000" style="max-width:220px"><button id="payBtn" type="button">Pay with Razorpay</button></div><p class="muted">Test mode is for testing; real customer payments require approved live credentials and onboarding.</p><h3>Launch GPU</h3><div class="grid"><select id="gpu"></select><input id="hrs" type="number" min=".25" step=".25" value="1"></div><button id="jobBtn" type="button">Launch compute</button><div id="jobs"></div></section></main><script src="/app.js?v=2"></script></body></html>
