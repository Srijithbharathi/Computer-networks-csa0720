<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Compute Cloud</title><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#07101d;color:#fff}main{max-width:1100px;margin:auto;padding:34px 18px}.hero{padding:24px 0}.card{background:#101c30;padding:20px;border-radius:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.gpu{cursor:pointer}.muted{color:#9fb0cc}button{padding:11px 16px;border:0;border-radius:9px;font-weight:700;cursor:pointer}input,select{box-sizing:border-box;padding:11px;margin:5px 0;width:100%;background:#07101d;color:#fff;border:1px solid #345;border-radius:8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#243653;font-size:12px}.danger{background:#7d2635;color:#fff}.success{color:#8fe0a0}</style></head><body><main><section class="hero"><h1>AI Compute Cloud</h1><p class="muted">On-demand GPU compute with transparent hourly pricing.</p></section><section class="card"><h2>GPU Catalogue</h2><div id="g" class="grid"></div></section><section class="card"><h2>Account</h2><div class="grid"><div><input id="rn" placeholder="Name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password (8+ characters)"><button onclick="reg()">Create account</button></div><div><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Sign in</button></div></div><p id="m" class="muted"></p></section><section id="d" class="card" style="display:none"><div class="row"><h2 style="margin-right:auto">Dashboard</h2><button onclick="logout()">Logout</button></div><div id="me"></div><hr><h3>Add wallet funds</h3><div class="row"><input id="fund" type="number" min="100" value="1000" style="max-width:220px"><button onclick="pay()">Pay with Razorpay</button></div><p class="muted">Test mode is for testing; real customer payments require approved live credentials and onboarding.</p><h3>Launch GPU</h3><div class="grid"><select id="gpu"></select><input id="hrs" type="number" min=".25" step=".25" value="1"></div><button onclick="job()">Launch compute</button><div id="jobs"></div></section></main><script>
const $=id=>document.getElementById(id);
let t=localStorage.getItem('acc_token')||'';
const els={g:$('g'),gpu:$('gpu'),rn:$('rn'),re:$('re'),rp:$('rp'),le:$('le'),lp:$('lp'),m:$('m'),d:$('d'),me:$('me'),fund:$('fund'),hrs:$('hrs'),jobs:$('jobs')};
async function api(path,options={}){
  const headers=Object.assign({},options.headers||{}, {'Content-Type':'application/json'});
  if(t) headers.Authorization='Bearer '+t;
  const res=await fetch(path,Object.assign({},options,{headers}));
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||('Request failed ('+res.status+')'));
  return data;
}
async function load(){
  try{
    const x=await api('/api/gpus');
    els.g.innerHTML=x.length?x.map(a=>'<div class="card gpu"><b>'+a.name+'</b><p>'+a.memoryGb+' GB VRAM</p><strong>$'+Number(a.priceUsdPerHour).toFixed(2)+'/hr</strong></div>').join(''):'<p class="muted">GPU catalogue is currently unavailable.</p>';
    els.gpu.innerHTML=x.map(a=>'<option value="'+a.id+'">'+a.name+' — $'+Number(a.priceUsdPerHour).toFixed(2)+'/hr</option>').join('');
    if(t) await dash();
  }catch(e){els.m.textContent='Connection error: '+e.message;console.error(e);}
}
async function reg(){
  try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:els.rn.value,email:els.re.value,password:els.rp.value})});els.m.textContent='Account created successfully. Sign in now.';}
  catch(e){els.m.textContent=e.message;}
}
async function login(){
  try{const x=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:els.le.value,password:els.lp.value})});t=x.token;localStorage.setItem('acc_token',t);await dash();els.m.textContent='';}
  catch(e){els.m.textContent=e.message;}
}
function logout(){localStorage.removeItem('acc_token');t='';location.reload();}
async function dash(){
  els.d.style.display='block';
  const x=await api('/api/me');
  els.me.innerHTML='<p><b>'+x.name+'</b> · '+x.email+' · Wallet <strong>$'+Number(x.balanceUsd).toFixed(2)+'</strong></p>';
  const j=await api('/api/jobs');
  els.jobs.innerHTML='<h3>Your GPU jobs</h3>'+(j.length?j.map(a=>'<div class="card"><div class="row"><b>'+a.gpuProduct.name+'</b><span class="pill">'+a.status+'</span><span>'+a.requestedHours+'h</span><span>$'+Number(a.estimatedCostUsd).toFixed(2)+'</span></div>'+(a.providerJobId&&!['STOPPED','FAILED'].includes(a.status)?'<button class="danger" onclick="stopJob(\''+a.id+'\')">Stop GPU</button>':'')+'</div>').join(''):'<p class="muted">No jobs yet.</p>');
}
async function pay(){
  try{const x=await api('/api/payments/order',{method:'POST',body:JSON.stringify({amountInr:Number(els.fund.value)})});
    new Razorpay({key:x.keyId,amount:x.amount,currency:x.currency,name:'AI Compute Cloud',description:'Wallet top-up',order_id:x.orderId,handler:async r=>{await api('/api/payments/verify',{method:'POST',body:JSON.stringify(r)});await dash();}}).open();
  }catch(e){alert(e.message);}
}
async function job(){
  try{const x=await api('/api/jobs',{method:'POST',body:JSON.stringify({gpuProductId:els.gpu.value,requestedHours:Number(els.hrs.value)})});alert('GPU request accepted: '+(x.provider?.status||'PROVISIONING'));await dash();}
  catch(e){alert(e.message);}
}
async function stopJob(id){
  if(!confirm('Stop this GPU and refund unused reserved time?'))return;
  try{const x=await api('/api/jobs/'+id+'/stop',{method:'POST'});alert('GPU stopped. Wallet refund: $'+Number(x.refundUsd||0).toFixed(2));await dash();}
  catch(e){alert(e.message);}
}
load();
</script></body></html>
