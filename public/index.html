<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Compute Cloud</title><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#07101d;color:#fff}main{max-width:1100px;margin:auto;padding:34px 18px}.hero{padding:24px 0}.card{background:#101c30;padding:20px;border-radius:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.gpu{cursor:pointer}.muted{color:#9fb0cc}button{padding:11px 16px;border:0;border-radius:9px;font-weight:700;cursor:pointer}input,select{box-sizing:border-box;padding:11px;margin:5px 0;width:100%;background:#07101d;color:#fff;border:1px solid #345;border-radius:8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#243653;font-size:12px}.danger{background:#7d2635;color:#fff}.success{color:#8fe0a0}</style></head><body><main><section class="hero"><h1>AI Compute Cloud</h1><p class="muted">On-demand GPU compute with transparent hourly pricing.</p></section><section class="card"><h2>GPU Catalogue</h2><div id="g" class="grid"></div></section><section class="card"><h2>Account</h2><div class="grid"><div><input id="rn" placeholder="Name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password (8+ characters)"><button onclick="reg()">Create account</button></div><div><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Sign in</button></div></div><p id="m" class="muted"></p></section><section id="d" class="card" style="display:none"><div class="row"><h2 style="margin-right:auto">Dashboard</h2><button onclick="logout()">Logout</button></div><div id="me"></div><hr><h3>Add wallet funds</h3><div class="row"><input id="fund" type="number" min="100" value="1000" style="max-width:220px"><button onclick="pay()">Pay with Razorpay</button></div><p class="muted">Test mode is for testing; real customer payments require approved live credentials and onboarding.</p><h3>Launch GPU</h3><div class="grid"><select id="gpu"></select><input id="hrs" type="number" min=".25" step=".25" value="1"></div><button onclick="job()">Launch compute</button><div id="jobs"></div></section></main><script>let t=localStorage.acc_token;async function api(p,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})};let r=await fetch(p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){let x=await api('/api/gpus');g.innerHTML=x.map(a=>'<div class="card gpu"><b>'+a.name+'</b><p>'+a.memoryGb+' GB VRAM</p><strong>$'+Number(a.priceUsdPerHour).toFixed(2)+'/hr</strong></div>').join('');gpu.innerHTML=x.map(a=>'<option value="'+a.id+'">'+a.name+' — $'+Number(a.priceUsdPerHour).toFixed(2)+'/hr</option>').join('');if(t)await dash()}async function reg(){try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:rn.value,email:re.value,password:rp.value})});m.textContent='Account created. Sign in now.'}catch(e){m.textContent=e.message}}async function login(){try{let x=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:le.value,password:lp.value})});t=x.token;localStorage.acc_token=t;await dash()}catch(e){m.textContent=e.message}}function logout(){localStorage.removeItem('acc_token');t=null;location.reload()}async function dash(){d.style.display='block';let x=await api('/api/me');me.innerHTML='<p><b>'+x.name+'</b> · '+x.email+' · Wallet <strong>$'+Number(x.balanceUsd).toFixed(2)+'</strong></p>';let j=await api('/api/jobs');jobs.innerHTML='<h3>Your GPU jobs</h3>'+(j.map(a=>'<div class="card"><div class="row"><b>'+a.gpuProduct.name+'</b><span class="pill">'+a.status+'</span><span>'+a.requestedHours+'h</span><span>$'+Number(a.estimatedCostUsd).toFixed(2)+'</span></div>'+(a.providerJobId&&!['STOPPED','FAILED'].includes(a.status)?'<button class="danger" onclick="stopJob(\''+a.id+'\')">Stop GPU</button>':'')+'</div>').join('')||'<p class="muted">No jobs yet.</p>')}async function pay(){try{let x=await api('/api/payments/order',{method:'POST',body:JSON.stringify({amountInr:Number(fund.value)})});new Razorpay({key:x.keyId,amount:x.amount,currency:x.currency,name:'AI Compute Cloud',description:'Wallet top-up',order_id:x.orderId,handler:async r=>{await api('/api/payments/verify',{method:'POST',body:JSON.stringify(r)});await dash()}}).open()}catch(e){alert(e.message)}}async function job(){try{let x=await api('/api/jobs',{method:'POST',body:JSON.stringify({gpuProductId:gpu.value,requestedHours:Number(hrs.value)})});alert('GPU request accepted: '+(x.provider?.status||'PROVISIONING'));await dash()}catch(e){alert(e.message)}}async function stopJob(id){if(!confirm('Stop this GPU and refund unused reserved time?'))return;try{let x=await api('/api/jobs/'+id+'/stop',{method:'POST'});alert('GPU stopped. Wallet refund: $'+Number(x.refundUsd||0).toFixed(2));await dash()}catch(e){alert(e.message)}}load().catch(e=>m.textContent=e.message)</script></body></html>
