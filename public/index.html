<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Compute Cloud</title><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>body{font-family:Arial;margin:0;background:#07101d;color:#fff}main{max-width:1000px;margin:auto;padding:50px 20px}.card{background:#101c30;padding:22px;border-radius:16px;margin:15px 0}button{padding:12px 18px;border:0;border-radius:9px;font-weight:bold}input,select{padding:11px;margin:6px;width:90%;background:#07101d;color:#fff;border:1px solid #345}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.muted{color:#9fb0cc}</style></head><body><main><h1>AI Compute Cloud</h1><p class="muted">On-demand GPU compute marketplace.</p><section class="card"><h2>GPU Catalogue</h2><div id="g" class="grid"></div></section><section class="card"><h2>Account</h2><div class="grid"><div><input id="rn" placeholder="Name"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Password"><button onclick="reg()">Register</button></div><div><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Login</button></div></div><p id="m" class="muted"></p></section><section id="d" class="card" style="display:none"><h2>Dashboard</h2><div id="me"></div><input id="fund" type="number" min="100" value="1000"><button onclick="pay()">Add funds with Razorpay</button><br><select id="gpu"></select><input id="hrs" type="number" min=".25" step=".25" value="1"><button onclick="job()">Request compute</button><div id="jobs"></div></section></main><script>let t=localStorage.acc_token;async function api(p,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})};let r=await fetch(p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){let x=await api('/api/gpus');g.innerHTML=x.map(a=>'<div class="card"><b>'+a.name+'</b><p>'+a.memoryGb+'GB VRAM</p><strong>$'+Number(a.priceUsdPerHour).toFixed(2)+'/hr</strong></div>').join('');gpu.innerHTML=x.map(a=>'<option value="'+a.id+'">'+a.name+' — $'+Number(a.priceUsdPerHour).toFixed(2)+'/hr</option>').join('');if(t)dash()}async function reg(){try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:rn.value,email:re.value,password:rp.value})});m.textContent='Registered. Sign in now.'}catch(e){m.textContent=e.message}}async function login(){try{let x=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:le.value,password:lp.value})});t=x.token;localStorage.acc_token=t;dash()}catch(e){m.textContent=e.message}}async function dash(){d.style.display='block';let x=await api('/api/me');me.innerHTML='<p>'+x.name+' · Balance $'+Number(x.balanceUsd).toFixed(2)+'</p>';let j=await api('/api/jobs');jobs.innerHTML=j.map(a=>'<p>'+a.gpuProduct.name+' · '+a.requestedHours+'h · '+a.status+'</p>').join('')||'<p>No jobs.</p>'}async function pay(){try{let x=await api('/api/payments/order',{method:'POST',body:JSON.stringify({amountInr:Number(fund.value)})});new Razorpay({key:x.keyId,amount:x.amount,currency:x.currency,name:'AI Compute Cloud',order_id:x.orderId,handler:async r=>{await api('/api/payments/verify',{method:'POST',body:JSON.stringify(r)});dash()}}).open()}catch(e){alert(e.message)}}async function job(){try{await api('/api/jobs',{method:'POST',body:JSON.stringify({gpuProductId:gpu.value,requestedHours:Number(hrs.value)})});dash()}catch(e){alert(e.message)}}load()</script></body></html>
