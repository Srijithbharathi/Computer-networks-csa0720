><p class="muted">Test mode is for testing; real customer payments require approved live credentials and onboarding.</p><h3>Launch GPU</h3><div class="grid"><select id="gpu"></select><input id="hrs" type="number" min=".25" step=".25" value="1"></div><button id="jobBtn" type="button">Launch compute</button><div id="jobs"></div></section></main><script src="/app.js?v=2"></script></body></html>
